[workspace]
members         = [
    "crates/mesh",
    "crates/occt-sys",
    "crates/step-stats"
]
resolver        = "3"

[workspace.package]
version         = "0.1.0"
edition         = "2024"

[workspace.dependencies]
cc              = { version = "1.6.0" }
clap            = { version = "4.6.7", features = ["derive"] }
error-location  = { version = "0.1.0" }
goblin          = { version = "0.10.7" }
libloading      = { version = "0.9.0" }
serde           = { version = "1.0.229", features = ["derive"] }
tempfile        = { version = "3.27.0" }
thiserror       = { version = "2.0.21" }
toml            = { version = "1.1.6" }

mesh        = { path = "./crates/mesh" }
occt-sys        = { path = "./crates/occt-sys" }

[workspace.lints.clippy]
unwrap_used     = "deny"
expect_used     = "deny"
panic           = "deny"

[workspace.lints.rust]
unused_must_use = "deny"
