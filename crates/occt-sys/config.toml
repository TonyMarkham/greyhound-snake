# Native-build configuration for occt-sys — the sole input source for
# build.rs. Every path resolves against the repository root (two levels
# above this crate), so all checkouts on all platforms parse identical
# values; the section matching CARGO_CFG_TARGET_OS supplies the per-OS
# deltas. A missing section is the platform gate: the shim has no story
# for that OS yet.
#
# Keys per section:
#   occt_prefix       OCCT install root: headers under
#                     <occt_prefix>/<include_dir>, link libraries under
#                     <occt_prefix>/<lib_dir>.
#   toolchain         "gnu" (clang/g++ as linker driver) or "msvc" (cl.exe
#                     driving link.exe).
#   include_dir       OCCT headers, relative to occt_prefix.
#   lib_dir           OCCT link libraries, relative to occt_prefix.
#   toolkit_pattern   Build-time link-library filename per toolkit, {tk}
#                     replaced by the toolkit name (TKernel, ...).
#   runtime_pattern   Runtime library filename per toolkit, {tk} replaced;
#                     the loader-test fixture stubs carry this name.
#   shim_filename     The shim artifact build.rs writes into shim_dir.
#   link_all_toolkits MSVC only: link every TK*.lib in lib_dir. link.exe
#                     has no ELF-style transitive search through a DLL's
#                     own dependencies, while an unused import library
#                     adds no DLL dependency — so the closed import set
#                     is whatever the shim actually uses.

# The shim's output directory. The runtime payload beside it
# (Runtime/Plugins/occt/x86_64) is NOT a build output on any platform:
# its lib/ is provisioned from the [occt.<os>.payload] entry of
# crates/extern-fetch/config.toml — by `just fetch-occt` here, or the
# Unity package's C# provisioner from the copy of that config staged
# into the package (refactor-repo.md D5/D8). Build-time inputs come from
# the [occt.<os>.dev] extractions under extern/.

shim_dir = "dist/package/com.greyhound.step/Runtime/Plugins/shim/x86_64"

[linux]
# Build-time inputs come from the pinned occt-dev release extraction
# (`just fetch-occt`), the same model as [windows]: headers under
# include/opencascade, the unversioned libTK*.so both the link step and
# the loader consume. UNVERIFIED LAYOUT: confirm from the extracted dev
# zip that it is the unified CMake tree before trusting these keys —
# the release record leaves the Linux zip layout unchecked.
occt_prefix = "extern/occt/8.0.1/linux-x86_64-dev"
toolchain = "gnu"
include_dir = "include/opencascade"
lib_dir = "lib"
toolkit_pattern = "lib{tk}.so"
runtime_pattern = "lib{tk}.so"
shim_filename = "libgreyhound_occt.so"

[windows]
# Build-time inputs come from the pinned occt-dev release extraction
# (crates/extern-fetch/config.toml; `just fetch-occt`): a unified CMake
# install tree — headers under include/opencascade, import libraries
# under lib. The shim links against the dev import libraries at build
# time; at run time it loads the payload DLLs, which come from the
# provisioned [occt.windows.payload] extraction, not from this tree.
occt_prefix = "extern/occt/8.0.1/win64-dev"
toolchain = "msvc"
include_dir = "include/opencascade"
lib_dir = "lib"
toolkit_pattern = "{tk}.lib"
runtime_pattern = "{tk}.dll"
shim_filename = "greyhound_occt.dll"
link_all_toolkits = true

[macos]
# Unexercised (AGENTS.md: the macOS integration is not yet exercised).
# Follows the Windows/Linux model — build inputs from the dev
# extraction, runtime payload provisioned; nothing here has run on a
# Mac, so the hashes are unpinned and the first run there records them.
occt_prefix = "extern/occt/8.0.1/macos-arm64-dev"
toolchain = "gnu"
include_dir = "include/opencascade"
lib_dir = "lib"
toolkit_pattern = "lib{tk}.dylib"
runtime_pattern = "lib{tk}.dylib"
shim_filename = "libgreyhound_occt.dylib"
