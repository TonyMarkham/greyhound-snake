# extern-fetch configuration — what to fetch, from where, and where it
# extracts. One table per dependency group; per-OS sub-tables keyed
# windows/linux/macos (a missing OS section is the platform gate); per-role
# entries (`dev` = build-time headers + link libraries for the shim, `libs`
# = runtime shared libraries for the payload pool). Consumers differ per
# role: the `dev` entries feed the shim build (consumed from the
# occt-sys-config-flip bite on); the `libs` entries have no consumer in
# this repo yet — they are pinned ahead for the provisioning bite
# (refactor-repo.md D7/D8) that wires extern-fetch and the C# provisioner
# to the shared package payload path.
#
# Rules, all enforced by the tool and checkable by hand:
#   - Every url must be a GitHub release asset of the group's own repo and
#     tag (`https://github.com/<repo>/releases/download/<tag>/<asset>`) —
#     the same-tag invariant (refactor-repo.md D2) enforced mechanically:
#     the dev zip and the libs zip can never drift onto different releases.
#   - dest is repo-root-relative with forward slashes, no `..`. The repo
#     root is two levels above this file's directory, the same rule
#     crates/occt-sys/config.toml states for its own paths.
#   - sha256 empty (or omitted) = unpinned: the tool downloads, extracts,
#     records the computed hash in the sibling provenance marker, prints
#     the hash, and exits non-zero. Once the hash is pinned here, the next
#     run verifies against it — the already-extracted tree is accepted
#     because the marker records exactly that hash.
#   - A dest directory is owned by this tool only when its sibling
#     `<dest>.provenance.toml` matches the config entry. A directory with
#     a matching marker is never touched again; anything else (no marker,
#     marker/entry mismatch) fails loudly and must be deleted by hand.
#
# See refactor-repo.md for the design decisions behind this file.

[occt]
repo = "TonyMarkham/occt-dev"
tag  = "v0.1.0"

[occt.windows.dev]
url    = "https://github.com/TonyMarkham/occt-dev/releases/download/v0.1.0/occt-8.0.1-x86_64-windows-dev.zip"
sha256 = "8ceafbaad923b9bc724123b3d676a53f153fdbaecab714be3dd2cb2143b0dd11"
dest   = "extern/occt/8.0.1/win64-dev"

[occt.windows.libs]
url    = "https://github.com/TonyMarkham/occt-dev/releases/download/v0.1.0/occt-8.0.1-x86_64-windows-dlls-only.zip"
sha256 = "7a336357b8c87a97737a54acb48ece86df3a437730dc3a5d16dde5e853691203"
dest   = "extern/occt/8.0.1/win64-libs"

# sha256 for the Linux and macOS archives is pinned from the corresponding
# build machine (or by running this tool there): the tool prints the hash,
# it goes into the matching entry, and the next run verifies against it.

[occt.linux.dev]
url    = "https://github.com/TonyMarkham/occt-dev/releases/download/v0.1.0/occt-8.0.1-x86_64-linux-dev.zip"
sha256 = ""
dest   = "extern/occt/8.0.1/linux-x86_64-dev"

[occt.linux.libs]
url    = "https://github.com/TonyMarkham/occt-dev/releases/download/v0.1.0/occt-8.0.1-x86_64-linux-libs-only.zip"
sha256 = ""
dest   = "extern/occt/8.0.1/linux-x86_64-libs"

[occt.macos.dev]
url    = "https://github.com/TonyMarkham/occt-dev/releases/download/v0.1.0/occt-8.0.1-arm64-macos-dev.zip"
sha256 = ""
dest   = "extern/occt/8.0.1/macos-arm64-dev"

[occt.macos.libs]
url    = "https://github.com/TonyMarkham/occt-dev/releases/download/v0.1.0/occt-8.0.1-arm64-macos-libs-only.zip"
sha256 = ""
dest   = "extern/occt/8.0.1/macos-arm64-libs"