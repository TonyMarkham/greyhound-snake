# extern-fetch configuration — what to fetch, from where, and where it
# extracts. One table per dependency group; per-OS sub-tables keyed
# windows/linux/macos (a missing OS section is the platform gate); per-role
# entries (`dev` = build-time headers + link libraries for the shim,
# `payload` = runtime shared libraries provisioned into the package
# payload dir). Consumers per role: the `dev` entries feed the shim build
# via crates/occt-sys/config.toml; the `payload` entries exist as the
# single pins source that assemble-package stages into the package as
# Editor/occt-fetch.toml — the C# provisioner reads its pins from that
# copy and is the ONLY writer of the package payload (only the C#
# fetcher puts anything in the dist package; the CLI fetch skips
# payload entries). Every platform
# carries dev + payload entries, all pinned (Linux/macOS pins from their
# release pages / build machines; a run on such a machine verifies the
# downloaded bytes against the pin).
#
# Rules, all enforced by the tool and checkable by hand:
#   - Every url must be a GitHub release asset of the group's own repo and
#     tag (`https://github.com/<repo>/releases/download/<tag>/<asset>`) —
#     the same-tag invariant, enforced mechanically:
#     the dev zip and the libs zip can never drift onto different releases.
#   - dest is repo-root-relative with forward slashes, no `..`. The repo
#     root is two levels above this file's directory, the same rule
#     crates/occt-sys/config.toml states for its own paths.
#   - sha256 empty (or omitted) = unpinned: the tool downloads, extracts,
#     records the computed hash in the sibling provenance marker, prints
#     the hash, and exits non-zero. Once the hash is pinned here, the next
#     run verifies against it — the already-extracted tree is accepted
#     because the marker records exactly that hash.
#   - A dest directory is owned by this tool only when its sibling
#     `<dest>.provenance.toml` matches the config entry. A directory with
#     a matching marker is never touched again; anything else (no marker,
#     marker/entry mismatch) fails loudly and must be deleted by hand.

# Where a downloader stages the archive bytes on disk before
# extraction. Empty (the tracked default): the archive is held in
# memory only — also the right default for machines whose IT policy
# locks down temp directories. Set: an absolute path, forward slashes
# (TOML basic strings treat `\` as an escape), to an EXISTING writable
# directory on the machine running the consumer — a per-machine
# override of a tracked-default-empty key, never committed with a real
# path. Both consumers honor it, staging their zip inside the directory
# and deleting it after extraction: this tool (`just fetch-occt`) and
# the Unity package's C# provisioner via the staged copy of this file
# (Editor/occt-fetch.toml). Neither creates the
# directory — a missing one fails loudly.
download_location = ""

